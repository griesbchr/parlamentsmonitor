// ── Topics ────────────────────────────────────────────────
function topicSlug(name) {
  const t = themen.find(t => t.name === name);
  return t ? t.slug : encodeURIComponent(name);
}
function topicLink(name) { return `#/thema/${topicSlug(name)}`; }

function topicStats() {
  const map = {};
  allItems.forEach(it => (it.topics || []).forEach(t => {
    const s = map[t] || (map[t] = { name: t, count: 0, contra: 0, headwords: {} });
    s.count++;
    if (contraParties(it).length) s.contra++;
    (it.headwords || []).forEach(h => s.headwords[h] = (s.headwords[h] || 0) + 1);
  }));
  return Object.values(map).sort((a, b) => b.count - a.count);
}
function topHeadwords(stat, n) {
  return Object.entries(stat.headwords).sort((a, b) => b[1] - a[1]).slice(0, n);
}

function renderTopics() {
  document.title = 'Themen – Parlamentsmonitor';
  const cards = topicStats().map(t => `
    <a class="topic-card" href="${topicLink(t.name)}">
      <div class="topic-name">${escHtml(t.name)}</div>
      <div class="topic-count">${t.count} Beschlüsse${t.contra
        ? ` · <span class="topic-contra">${t.contra} mit Widerspruch</span>` : ''}</div>
      <div class="topic-hw">${topHeadwords(t, 3).map(([h]) => escHtml(h)).join(' · ')}</div>
    </a>`).join('');
  document.getElementById('detail-content').innerHTML = `
    <div class="card intro">
      <h2>Themen</h2>
      <p>Alle Beschlüsse nach den Themenbereichen des Parlaments. Zu jedem Thema: wie die Parteien
         abgestimmt haben, wo sie laut KI-Einschätzung ihrem Wahlprogramm widersprechen – und was sie
         in ihren Wahlprogrammen dazu versprochen haben.</p>
    </div>
    <div class="topic-grid">${cards}</div>`;
}

let topicHeadword = '';

function renderTopic(slug) {
  const meta = themen.find(t => t.slug === slug);
  const name = meta ? meta.name : slug;
  const items = allItems.filter(it => (it.topics || []).includes(name))
    .sort((a, b) => parseDatum(b.datum) - parseDatum(a.datum));
  if (!items.length) {
    document.getElementById('detail-content').innerHTML = '<div class="loading">Thema nicht gefunden.</div>';
    return;
  }
  document.title = `${name} – Parlamentsmonitor`;
  topicHeadword = '';

  // keep the list on the left in sync with the topic
  document.getElementById('filterThema').value = name;
  updateAndRender();

  // how each party voted on this topic
  const rows = PARTIES.map(p => {
    let pro = 0, con = 0, contra = 0, aligned = 0;
    items.forEach(it => {
      const v = it.votes.find(v => v.club === p);
      if (v) v.in_favor ? pro++ : con++;
      const s = it.scores && it.scores[p];
      if (s !== undefined && s <= -1) contra++;
      if (s !== undefined && s >= 1) aligned++;
    });
    const total = pro + con || 1;
    return `
      <tr>
        <td>${chip(p)}</td>
        <td class="vbar-cell">
          <div class="vbar" title="${pro} dafür, ${con} dagegen">
            <span class="vbar-pro" style="width:${100 * pro / total}%"></span>
            <span class="vbar-con" style="width:${100 * con / total}%"></span>
          </div>
          <div class="vbar-lbl"><span>${pro} dafür</span><span>${con} dagegen</span></div>
        </td>
        <td class="num ${contra ? 'contra-num' : ''}">${contra}</td>
        <td class="num">${aligned}</td>
      </tr>`;
  }).join('');

  const stat = topicStats().find(t => t.name === name);
  const chips = topHeadwords(stat, 14).map(([h, n]) =>
    `<button class="hw-chip" data-hw="${escHtml(h)}">${escHtml(h)} <span>${n}</span></button>`).join('');

  document.getElementById('detail-content').innerHTML = `
    <div class="detail-header">
      <div class="detail-meta"><a href="#/themen">← Alle Themen</a></div>
      <div class="detail-title">${escHtml(name)}</div>
      <div class="detail-description">${items.length} Beschlüsse seit Beginn der XXVIII. GP ·
        ${items.filter(i => contraParties(i).length).length} davon mit Widerspruch zum Wahlprogramm</div>
    </div>

    <div class="card">
      <h3>So haben die Parteien abgestimmt</h3>
      <table class="party-table">
        <thead><tr><th></th><th>Abstimmungen</th>
          <th class="num" title="KI-Einschätzung">Widerspruch <span class="ai-label">KI</span></th>
          <th class="num" title="KI-Einschätzung">Im Einklang <span class="ai-label">KI</span></th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>

    <div class="card">
      <h3>Wer stimmt mit wem? – ${escHtml(name)}</h3>
      ${agreementMatrix(items)}
    </div>

    <div class="card">
      <h3>Was die Parteien versprochen haben</h3>
      <div id="topic-manifesto"><div class="muted">Lade Wahlprogramme…</div></div>
    </div>

    <div class="card">
      <h3>Beschlüsse</h3>
      <div class="hw-chips">${chips}</div>
      <div id="topic-items"></div>
    </div>`;

  document.querySelectorAll('.hw-chip').forEach(b => b.addEventListener('click', () => {
    topicHeadword = topicHeadword === b.dataset.hw ? '' : b.dataset.hw;
    document.querySelectorAll('.hw-chip').forEach(x => x.classList.toggle('active', x.dataset.hw === topicHeadword));
    renderTopicItems(items);
  }));
  renderTopicItems(items);

  fetch(API.thema(slug)).then(r => r.json()).then(d => {
    if (location.hash !== `#/thema/${slug}`) return;
    document.getElementById('topic-manifesto').innerHTML = renderTopicManifesto(d);
  }).catch(() => {
    document.getElementById('topic-manifesto').innerHTML = '<div class="muted">Konnte nicht geladen werden.</div>';
  });
}

function renderTopicItems(items) {
  const shown = topicHeadword ? items.filter(i => (i.headwords || []).includes(topicHeadword)) : items;
  document.getElementById('topic-items').innerHTML = shown.map(it => {
    const cp = contraParties(it);
    return `
      <a class="topic-item" href="#/beschluss/${it.id}">
        <div class="topic-item-date">${escHtml(it.datum)}</div>
        <div>
          <div class="topic-item-title">${escHtml(it.title)}</div>
          ${it.teaser ? `<div class="item-teaser">${escHtml(it.teaser)}</div>` : ''}
          <div class="vote-line">${voteLine(it.votes)}
            ${cp.length ? `<span class="contra-badge ${cp.some(p => it.scores[p] <= -2) ? 'strong' : ''}" style="margin:0">⚠ ${cp.map(escHtml).join(', ')}</span>` : ''}</div>
        </div>
      </a>`;
  }).join('') || '<p class="muted">Keine Beschlüsse.</p>';
}

function renderTopicManifesto(d) {
  const parties = PARTIES.filter(p => (d.sections[p] || []).length);
  if (!parties.length) return '<p class="muted">Keine passenden Abschnitte gefunden.</p>';
  const tabs = parties.map((p, i) =>
    `<button class="party-tab ${i === 0 ? 'active' : ''}" data-party="${p}"
             style="--pc:${partyColor(p)}">${p} <span>${d.sections[p].length}</span></button>`).join('');
  const panels = parties.map((p, i) => `
    <div class="party-panel" data-party="${p}" ${i === 0 ? '' : 'hidden'}>
      ${d.sections[p].map(s => `
        <details class="mf-section">
          <summary>${escHtml(s.path)}</summary>
          <div class="quote">${escHtml(s.text)}</div>
        </details>`).join('')}
    </div>`).join('');
  setTimeout(() => document.querySelectorAll('.party-tab').forEach(b => b.addEventListener('click', () => {
    document.querySelectorAll('.party-tab').forEach(x => x.classList.toggle('active', x === b));
    document.querySelectorAll('.party-panel').forEach(x => x.hidden = x.dataset.party !== b.dataset.party);
  })));
  return `
    <p class="muted" style="margin-bottom:10px">Abschnitte aus den Wahlprogrammen 2024 zum Thema
      ${escHtml(d.name)} – wörtlich zitiert, automatisch zugeordnet.</p>
    <div class="party-tabs">${tabs}</div>
    ${panels}`;
}

// ── Methodik ──────────────────────────────────────────────
function renderMethod() {
  document.title = 'Methodik – Parlamentsmonitor';
  const scale = ['-2', '-1', '0', '1', '2'].map(k =>
    `<tr><td><span class="analyse-score-badge ${SCORE_META[k].cls}">${scoreText(+k)} ${SCORE_META[k].label}</span></td><td>${{
      '-2': 'Die Partei stimmte gegen eine ausdrückliche Aussage ihres Wahlprogramms.',
      '-1': 'Die Abstimmung weicht von der Richtung des Wahlprogramms ab.',
      '0':  'Das Thema kommt im Wahlprogramm nicht (erkennbar) vor.',
      '1':  'Die Abstimmung passt zur allgemeinen Richtung des Wahlprogramms.',
      '2':  'Die Partei stimmte für die Umsetzung eines konkreten Wahlversprechens.',
    }[k]}</td></tr>`).join('');

  document.getElementById('detail-content').innerHTML = `
    <div class="card prose">
      <h2>Methodik</h2>
      <p>Der Parlamentsmonitor ist ein unabhängiges, privates Projekt. Er steht in keiner Verbindung zum
         Parlament oder zu einer Partei.</p>

      <h3>Datenquellen</h3>
      <ul>
        <li><b>Beschlüsse, Abstimmungsergebnisse und Dokumente</b>: offene Daten des österreichischen Parlaments
            (<a href="${PARL}" target="_blank">parlament.gv.at</a>). Abgestimmt wird nach Klubs, nicht nach einzelnen Abgeordneten.</li>
        <li><b>Begründungen der Parteien</b>: die Berichte der Parlamentskorrespondenz zu Ausschuss- und Plenarsitzungen.
            Es sind Zusammenfassungen der Debatte, keine wörtlichen Reden.</li>
        <li><b>Wahlprogramme</b>: die Programme von ÖVP, SPÖ, FPÖ, GRÜNEN und NEOS zur Nationalratswahl 2024.
            Zitate werden wörtlich angezeigt.</li>
      </ul>

      <h3>So entsteht eine Bewertung</h3>
      <ol>
        <li>Die Wahlprogramme werden in rund 1.000 Abschnitte zerlegt und Themenbereichen zugeordnet.</li>
        <li>Für jede Abstimmung und Partei werden die drei inhaltlich ähnlichsten Abschnitte des Programms gesucht (semantische Suche mit einem lokal laufenden Sprachmodell, das Bedeutungen statt einzelner Wörter vergleicht).</li>
        <li>Eine KI (Claude von Anthropic) erhält: Titel des Beschlusses, einen Auszug aus den Erläuterungen bzw. dem Gesetzestext,
            das Abstimmungsverhalten der Partei, ihre Begründung laut Parlamentskorrespondenz und die Programm-Abschnitte.</li>
        <li>Sie vergibt eine Bewertung von −2 bis +2, wählt den passendsten Abschnitt und begründet ihre Einschätzung in ein bis zwei Sätzen. Ein Widerspruch setzt voraus, dass sich das Programm konkret zum Gegenstand der Abstimmung äußert – allgemeine Ziele reichen nicht.</li>
        <li>Jede Abstimmung, die dabei als Widerspruch eingestuft wird, bewertet die KI ein zweites Mal ausführlicher. Angezeigt wird das Ergebnis dieser zweiten Bewertung. Beide Schritte sind automatisch; eine Kontrolle durch Menschen findet nicht statt.</li>
      </ol>
      <table>${scale}</table>

      <h3>Grenzen</h3>
      <ul>
        <li>Die KI kann Gesetze, Programme oder Begründungen falsch verstehen. Jede Bewertung ist eine Einschätzung, kein Urteil.</li>
        <li>Die Suche kann relevante Stellen im Wahlprogramm übersehen – dann fällt die Bewertung oft auf „Kein Bezug“.</li>
        <li>Regierungsparteien stimmen Koalitionskompromissen zu, die vom eigenen Programm abweichen können.
            Oppositionsparteien lehnen Gesetze manchmal wegen Details ab, obwohl sie das Ziel teilen.</li>
        <li>Nicht jeder Beschluss wird in der Parlamentskorrespondenz ausführlich behandelt; dann fehlt die Begründung der Partei.</li>
        <li>Die Themen der Beschlüsse stammen vom Parlament. Die Zuordnung der Wahlprogramm-Abschnitte zu Themen
            erfolgt dagegen automatisch über die inhaltliche Ähnlichkeit (Embeddings) zu kurzen Themenbeschreibungen
            und ist nicht immer treffend. Sehr allgemeine Abschnitte, etwa Einleitungen, werden keinem Thema zugeordnet.</li>
        <li>Kurzinformationen ohne offizielle Zusammenfassung des Parlaments sind KI-generiert und entsprechend gekennzeichnet.</li>
      </ul>

      <h3>Aktualisierung</h3>
      <p>Die Daten werden wöchentlich aktualisiert. Der Stand steht oben rechts.</p>

      <h3>Fehler gefunden?</h3>
      <p>Hinweise auf falsche Bewertungen oder Daten bitte als
         <a href="${ISSUES_URL}" target="_blank">Issue auf GitHub</a> melden.</p>
    </div>`;
}

// ── Detail ────────────────────────────────────────────────
function loadDetail(id) {
  document.getElementById('detail-content').innerHTML = '<div class="loading">Lade…</div>';
  const load = STATIC
    ? fetch(`data/items/${id}.json`).then(r => { if (!r.ok) throw new Error(); return r.json(); }).then(d => [d.item, d.analyses])
    : Promise.all([
        fetch(`/api/items/${id}`).then(r => { if (!r.ok) throw new Error(); return r.json(); }),
        fetch(`/api/items/${id}/analyses`).then(r => r.json()),
      ]);
  load.then(([item, analyses]) => {
    if (location.hash !== `#/beschluss/${id}`) return;   // user navigated away meanwhile
    renderDetail(item, analyses);
  }).catch(() => {
    document.getElementById('detail-content').innerHTML = '<div class="loading">Beschluss nicht gefunden.</div>';
  });
}

function analysisBody(a) {
  const who = (a.speakers || []).length ? ` · ${a.speakers.map(escHtml).join(', ')}` : '';
  const sources = (a.sources || []).map(s =>
    `<a href="${PARL}${escHtml(s.url)}" target="_blank" title="${escHtml(s.title)}">↗ Parlamentskorrespondenz ${escHtml(s.date)}</a>`).join('');
  const said = a.statement
    ? `<div class="statement">${escHtml(a.statement)}</div>${sources ? `<div class="sources">${sources}</div>` : ''}`
    : '<div class="muted">Keine Begründung in der Parlamentskorrespondenz gefunden.</div>';
  const quote = a.section_text
    ? `<div class="quote">${escHtml(a.section_text)}</div>`
    : '<div class="muted">Kein passender Abschnitt im Wahlprogramm gefunden.</div>';
  const sm = SCORE_META[String(a.score)] || SCORE_META['0'];
  return `
    <div class="block"><div class="block-label">Was die Partei sagt <span class="who">${who}</span></div>${said}</div>
    <div class="block"><div class="block-label">Was im Wahlprogramm steht
      <span class="who">${a.section_path ? '· ' + escHtml(a.section_path) : ''}</span></div>${quote}</div>
    <div class="block"><div class="block-label">KI-Einschätzung: ${scoreText(a.score)} ${sm.label}</div>
      <div class="assessment">${escHtml(a.explanation)}</div>
      <div class="report-row">
        <a class="report-btn" href="${reportUrl(a)}" target="_blank" rel="noopener"
           title="Öffnet ein vorausgefülltes Formular auf GitHub (GitHub-Konto nötig)">⚑ Bewertung falsch?</a>
      </div></div>`;
}

// Pre-filled GitHub issue for reporting a wrong assessment
function reportUrl(a) {
  const it = currentItem || {};
  const sm = SCORE_META[String(a.score)] || SCORE_META['0'];
  const vote = a.party_vote === 'JA' ? 'dafür' : a.party_vote === 'NEIN' ? 'dagegen' : 'Enthaltung';
  const link = `${location.origin}${location.pathname}#/beschluss/${it.id}`;
  const title = `Bewertung falsch: ${a.party} – ${it.title || ''}`.slice(0, 200);
  const body = [
    `**Beschluss:** ${it.title || ''} (${it.zitation || ''}, ${it.datum || ''})`,
    `**Link:** ${link}`,
    `**Partei:** ${a.party} – stimmte ${vote}`,
    `**KI-Bewertung:** ${scoreText(a.score)} ${sm.label}`,
    `**KI-Begründung:** ${a.explanation || ''}`,
    '',
    '**Was ist an der Bewertung falsch, und wie wäre sie richtig?**',
    '',
    '',
  ].join('\n');
  return `${ISSUES_URL}/new?title=${encodeURIComponent(title)}&body=${encodeURIComponent(body)}`;
}

function analysisRow(a, i, expanded) {
  const sm = SCORE_META[String(a.score)] || SCORE_META['0'];
  const vdir = a.party_vote === 'JA' ? 'ja' : a.party_vote === 'NEIN' ? 'nein' : 'enth';
  const vLabel = a.party_vote === 'JA' ? 'Dafür' : a.party_vote === 'NEIN' ? 'Dagegen' : 'Enthaltung';
  return `
    <div class="analyse-row ${a.score <= -1 ? 'contra' : ''} ${expanded ? 'expanded' : ''}" id="arow-${i}">
      <div class="analyse-row-header" onclick="document.getElementById('arow-${i}').classList.toggle('expanded')">
        <span class="analyse-party-badge" style="background:${partyColor(a.party)}">${escHtml(a.party)}</span>
        <span class="analyse-vote-dir ${vdir}">${vLabel}</span>
        <span class="analyse-score-badge ${sm.cls}">${scoreText(a.score)} ${sm.label}</span>
        <span class="analyse-hint">${a.statement ? 'Begründung · ' : ''}Wahlprogramm · Einschätzung</span>
        <svg class="analyse-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
      </div>
      <div class="analyse-row-body">${analysisBody(a)}</div>
    </div>`;
}

function renderAnalyses(analyses) {
  if (!analyses || !analyses.length) {
    return `<div class="card"><h3>Passt das zum Wahlprogramm?</h3>
              <p class="muted">Für diesen Beschluss liegt noch keine Bewertung vor.</p></div>`;
  }
  const sortedA = [...analyses].sort((a, b) => a.score - b.score);
  const contra = sortedA.filter(a => a.score <= -1);
  const rest   = sortedA.filter(a => a.score > -1).sort((a, b) => b.score - a.score);

  const contraHtml = contra.map((a, i) => analysisRow(a, i, true)).join('');
  const restRows = rest.map((a, i) => analysisRow(a, contra.length + i, false)).join('');
  const restSummary = rest.map(a => {
    const sm = SCORE_META[String(a.score)];
    return `${chip(a.party)}<span class="analyse-score-badge ${sm.cls}">${scoreText(a.score)}</span>`;
  }).join(' ');
  const restHtml = !rest.length ? '' : contra.length
    ? `<details class="consistent-group">
         <summary>Kein Widerspruch bei: ${restSummary} <span class="more">Details anzeigen</span></summary>
         ${restRows}
       </details>`
    : restRows;

  return `
    <div class="card">
      <h3>Passt das zum Wahlprogramm? <span class="ai-label">KI-Einschätzung</span></h3>
      <details class="scale-info">
        <summary>Wie wird bewertet?</summary>
        <table>${['-2','-1','0','1','2'].map(k =>
          `<tr><td><span class="analyse-score-badge ${SCORE_META[k].cls}">${scoreText(+k)} ${SCORE_META[k].label}</span></td></tr>`).join('')}</table>
        <p style="margin-top:6px">Eine KI vergleicht die Abstimmung mit dem Wahlprogramm 2024 und der Begründung der Partei.
           Sie kann sich irren – mehr unter <a href="#/methodik">Methodik</a>.</p>
      </details>
      ${contra.length ? '' : '<p class="muted" style="margin-bottom:10px">Keine Partei hat hier laut KI-Einschätzung gegen ihr Wahlprogramm gestimmt.</p>'}
      ${contraHtml}
      ${restHtml}
    </div>`;
}

function renderDetail(item, analyses) {
  currentDocs = item.documents || [];
  currentItem = item;
  document.title = `${item.title} – Parlamentsmonitor`;

  const pro = item.votes.filter(v => v.in_favor), con = item.votes.filter(v => !v.in_favor);
  const badge = v => `<span class="vote-badge" style="background:${v.color}"
                         title="${v.seats ? v.seats + ' Sitze' : ''}">${escHtml(v.club)}</span>`;
  const votesHtml = item.votes.length ? `
    <div class="vote-rows">
      <div class="vote-row"><span class="vlabel for">✓ Dafür</span>${pro.map(badge).join('') || '<span class="muted">–</span>'}</div>
      <div class="vote-row"><span class="vlabel against">✗ Dagegen</span>${con.map(badge).join('') || '<span class="muted">–</span>'}</div>
    </div>` : '<p class="muted">Keine Abstimmungsdaten.</p>';

  const shortinfoBody = (item.shortinfo || '').replace(/^Kurzinformation\s*/i, '').trim();
  const shortinfoHtml = shortinfoBody ? `
    <div class="card">
      <h3>Worum geht es? ${item.shortinfo_llm ? '<span class="ai-label" title="Keine offizielle Kurzinformation vorhanden – automatisch zusammengefasst">KI-Zusammenfassung</span>' : ''}</h3>
      <div class="shortinfo">${shortinfoBody}</div>
    </div>` : '';

  const tags = item.tags || {};
  const tagHtml = [
    ...(tags.topic    ? tags.topic.split(', ').map(t => `<a class="tag topic" href="${topicLink(t)}" title="Alle Beschlüsse zum Thema">${escHtml(t)} →</a>`) : []),
    ...(tags.headword ? tags.headword.split(', ').map(t => `<span class="tag headword">${escHtml(t)}</span>`) : []),
    ...(tags.eurovoc  ? tags.eurovoc.split(', ').map(t => `<span class="tag">${escHtml(t)}</span>`) : []),
  ].join('');

  let docsHtml = '';
  if (currentDocs.length && STATIC) {
    docsHtml = `<div class="card"><h3>Dokumente</h3><div class="doc-links">
      ${currentDocs.map(d => `<a href="${PARL}${escHtml(d.url)}" target="_blank">↗ ${escHtml(d.title || 'Dokument')}</a>`).join('')}
    </div></div>`;
  } else if (currentDocs.length) {
    docsHtml = `<div class="card"><h3>Dokumente</h3>
      <div class="doc-tab-bar">${currentDocs.map((d, i) =>
        `<div class="doc-tab ${i === 0 ? 'active' : ''}" onclick="showDoc(${i}, this)">${escHtml(d.title)}</div>`).join('')}</div>
      <iframe class="doc-frame" id="doc-frame" src="${currentDocs[0].has_html ? '/doc/' + currentDocs[0].id : ''}"
              sandbox="allow-same-origin allow-scripts"></iframe></div>`;
  }

  document.getElementById('detail-content').innerHTML = `
    <div class="detail-header">
      <div class="detail-meta">
        <span>${escHtml(item.datum)}</span>
        <span class="detail-zitation">${escHtml(item.zitation)}</span>
        <span class="badge">${escHtml(DOKTYP_NAMES[item.doktyp] || item.doktyp)}</span>
        <a class="link-btn" href="${PARL}${escHtml(item.his_url)}" target="_blank">↗ parlament.gv.at</a>
        <button class="link-btn" onclick="copyLink()">🔗 Link kopieren</button>
      </div>
      <div class="detail-title">${escHtml(item.title)}</div>
      ${item.description ? `<div class="detail-description">${escHtml(item.description)}</div>` : ''}
    </div>

    ${shortinfoHtml}

    <div class="card"><h3>Abstimmung im Nationalrat</h3>${votesHtml}</div>

    ${renderAnalyses(analyses)}

    ${tagHtml ? `<div class="card"><h3>Schlagworte</h3><div class="tags-section">${tagHtml}</div></div>` : ''}

    ${docsHtml}`;
}

function showDoc(idx, el) {
  document.querySelectorAll('.doc-tab').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  const doc = currentDocs[idx];
  document.getElementById('doc-frame').src = doc.has_html ? `/doc/${doc.id}` : '';
}

function copyLink() {
  navigator.clipboard.writeText(location.href)
    .then(() => toast('Link kopiert'))
    .catch(() => toast(location.href));
}
</script>
